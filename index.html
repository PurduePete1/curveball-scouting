    log.innerHTML = coachMsgs.map(m => `<div class="msg ${m.role === "user" ? "user" : m.err ? "ai err" : "ai"}">${m.role === "user" ? esc(m.content) : (m.content ? mdLite(m.content) : "<p class='muted'>Thinking…</p>")}</div>`).join("");
  }
  log.scrollTop = log.scrollHeight;
}
function openCoach() { document.getElementById("coach").classList.add("open"); document.getElementById("askFab").style.visibility = "hidden"; renderCoach(); document.getElementById("coachInput").focus(); }
function closeCoach() { document.getElementById("coach").classList.remove("open"); document.getElementById("askFab").style.visibility = ""; }

async function askCoach(q, includeFA = state.view === "free-agent") {
  q = (q || "").trim(); if (!q || !sampleFn || coachBusy) return;
  coachBusy = true;
  coachMsgs.push({ role: "user", content: q });
  const answer = { role: "assistant", content: "" };
  coachMsgs.push(answer); renderCoach();
  // Rebuild the conversation with fresh roster data in the first message (Claude has no memory between calls).
  const convo = coachMsgs.filter(m => !m.err && m !== answer).map(m => ({ role: m.role, content: m.content }));
  convo[0] = { role: "user", content: rosterContext(includeFA) + "\n\nQUESTION: " + convo[0].content };
  coachAbort = new AbortController();
  try {
    const res = await sampleFn(convo, { cache: false, signal: coachAbort.signal, onText: ({ text }) => { answer.content = text; renderCoach(); } });
    answer.content = res.text || answer.content || "(No answer came back.)";
  } catch (err) {
    answer.err = true;
    answer.content = err && err.code === "rate_limited" ? "Claude is busy right now. Try again in a minute."
      : err && err.code === "not_granted" ? "Asking Claude isn't allowed on this page right now."
      : (err && err.text) || "Something went wrong asking Claude. Try again.";
  } finally { coachBusy = false; coachAbort = null; renderCoach(); }
}
document.getElementById("askFab").addEventListener("click", openCoach);
document.getElementById("coachClose").addEventListener("click", closeCoach);
document.getElementById("coachClear").addEventListener("click", () => { if (coachAbort) coachAbort.abort(); coachMsgs = []; coachBusy = false; renderCoach(); });
document.getElementById("coachLog").addEventListener("click", e => { const c = e.target.closest("[data-q]"); if (c) askCoach(c.dataset.q); });
document.getElementById("coachForm").addEventListener("submit", e => { e.preventDefault(); const i = document.getElementById("coachInput"); const q = i.value; i.value = ""; askCoach(q); });
document.getElementById("coachInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("coachForm").requestSubmit(); } });

// ---------------------------------------------------------------- reading card screenshots
state.cardRead = { status: "idle" };
let imagesOK = false;
(async () => {
  // Wait for the sample capability, then check whether this view can send images.
  for (let i = 0; i < 60 && !sampleFn; i++) await new Promise(r => setTimeout(r, 250));
  if (!sampleFn) return;
  try { const lim = await sampleFn.limits(); imagesOK = !!(lim && lim.images); } catch (_) { imagesOK = false; }
  if (imagesOK) document.body.classList.add("has-images");
})();
const H_KEYS = ["contact", "power", "eye", "bunt", "speed", "aware", "aggr", "range", "handling", "arm", "flex"];
const P_KEYS = ["velo", "acc", "fin", "end", "range", "handling", "arm"];
const CARD_PROMPT = `These are screenshots of player cards from curveball.gg, a browser baseball sim. Read every player card whose name and ratings you can read. If cards overlap, include the ones you can read and use null for any rating you can't see.

Reply with only JSON in this shape:
{"cards":[{"name":"Bo Durham","type":"Hitter","pos1":"3B","pos2":"1B","hand":"R","age":20,"ovr":48,"contact":46,"power":52,"eye":45,"bunt":55,"speed":39,"aware":42,"aggr":38,"range":54,"handling":45,"arm":49,"flex":58,"hidden":[]}]}

For a pitcher use "type":"Pitcher" and the keys "velo","acc","fin","end","range","handling","arm" instead of the hitting keys.

How to read a card:
- Rating names: Contact=contact, Power=power, Plate Discipline=eye, Bunting=bunt, Fielding Range=range, Handling=handling, Arm Strength=arm, Flexibility=flex, Speed=speed, Aggression=aggr, Awareness=aware, Velocity=velo, Accuracy=acc, Finesse=fin, Endurance=end.
- A rating shown as "??" is hidden: set it to null and add its key to "hidden". Use null for "ovr" if the big number is "??".
- Hitter positions: use C, 1B, 2B, 3B, SS, LF, CF, RF only. Take them from the line under the name (like "3B/1B" or "CF/RF"), or from the "PLAYS ..." line at the bottom (ignore DH). If the card just says "OF", use the first two outfield spots from the PLAYS line. pos2 is null if there is no second position.
- Pitcher positions: "SP" for starters, "MR" for middle relievers, "CL" for closers.
- hand: for hitters the first letter of Bats/Throws (like "R/L" means R); "S" for switch hitters. For pitchers, the throwing hand.
- age: the number after "AGE".`;

function cardToForm(c) {
  const isH = (c.type || "").toLowerCase().startsWith("h");
  const keys = isH ? H_KEYS : P_KEYS;
  const num = v => (v === null || v === undefined || v === "" || isNaN(Number(v))) ? null : Math.round(Number(v));
  const POS_H = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"], POS_P = ["SP", "MR", "CL"];
  let pos1 = String(c.pos1 || "").toUpperCase(), pos2 = String(c.pos2 || "").toUpperCase();
  if (isH && !POS_H.includes(pos1)) pos1 = "CF";
  if (isH && !POS_H.includes(pos2)) pos2 = "";
  if (!isH && !POS_P.includes(pos1)) pos1 = (num(c.end) ?? 0) >= 55 ? "SP" : "MR";
  const f = { name: String(c.name || "Unknown player").trim(), pos1, pos2: isH ? pos2 : "", hand: ["R", "L", "S"].includes(String(c.hand || "").toUpperCase()) ? String(c.hand).toUpperCase() : "R", age: num(c.age) ?? "", tier: "Green" };
  const assumed = [];
  const known = keys.map(k => num(c[k])).filter(v => v !== null);
  const fallback = known.length ? Math.round(known.reduce((a, b) => a + b, 0) / known.length) : 45;
  keys.forEach(k => {
    const v = num(c[k]);
    if (v === null) { f[k] = Math.min(fallback, 50); assumed.push(k); } else f[k] = Math.max(0, Math.min(100, v));
  });
  const label = { contact: "Contact", power: "Power", eye: "Plate discipline", bunt: "Bunting", speed: "Speed", aware: "Awareness", aggr: "Aggression", range: "Range", handling: "Handling", arm: "Arm", flex: "Flexibility", velo: "Velocity", acc: "Accuracy", fin: "Finesse", end: "Endurance" };
  return { type: isH ? "Hitter" : "Pitcher", f, assumed: assumed.length ? `${assumed.map(k => label[k]).join(", ")} ${assumed.length === 1 ? "was" : "were"} hidden or unreadable, so I assumed ${f[assumed[0]]}.` : "" };
}

async function readCardImage(file) {
  if (!file || !sampleFn || !imagesOK || state.cardRead.status === "reading") return;
  if (state.view !== "free-agent") { location.hash = "free-agent"; }
  let thumb = "";
  try { thumb = URL.createObjectURL(file); } catch (_) {}
  state.cardRead = { status: "reading", thumb };
  render();
  try {
    const out = await sampleFn.json(CARD_PROMPT, { images: [file], cache: false });
    const cards = (out && Array.isArray(out.cards) ? out.cards : Array.isArray(out) ? out : []).filter(c => c && c.name);
    if (!cards.length) throw { code: "no_cards" };
    const forms = cards.map(cardToForm);
    // Check every card against the roster as it stands now.
    const saveType = state.faType, saveFA = { Hitter: { ...state.fa.Hitter }, Pitcher: { ...state.fa.Pitcher } };
    const summary = forms.map(x => {
      state.faType = x.type; state.fa[x.type] = { ...x.f };
      const r = analyzeFA(), v = verdictFor(r);
      const dropTxt = r.drop ? (r.drop.move === "transfer" ? `Send ${r.drop.p.name} to the ${clubShort("farm")}` : `Release ${r.drop.p.name}`) : "";
      return { name: x.f.name, pos: x.type === "Hitter" ? `${x.f.pos1}${x.f.pos2 ? "/" + x.f.pos2 : ""} · bats ${x.f.hand}` : `${x.f.pos1} · throws ${x.f.hand}`, kind: v.kind, word: v.word, line: v.line, drop: dropTxt, assumed: x.assumed, form: x };
    });
    state.fa = saveFA; state.faType = saveType;
    // Open the best card (or the only one) in the form.
    const rank = { sign: 0, maybe: 1, pass: 2 };
    const best = [...summary.keys()].sort((a, b) => rank[summary[a].kind] - rank[summary[b].kind])[0];
    loadCardForm(summary[best].form);
    state.cardRead = { status: "done", thumb, summary, msg: summary.length === 1 ? `Read ${summary[0].name}.${summary[0].assumed ? " " + summary[0].assumed : ""}` : `Read ${summary.length} cards. ${summary[best].name} is open in the form below.` };
    faFlash = summary.length === 1 && summary[0].assumed ? esc(summary[0].assumed) : "";
  } catch (e) {
    const code = e && e.code;
    const msg = code === "not_granted" ? "Reading screenshots isn't allowed on this page right now."
      : code === "rate_limited" ? "Claude is busy right now. Try again in a minute."
      : code === "image_rejected" ? "That image couldn't be used. Try a PNG or JPG screenshot."
      : code === "images_unavailable" ? "This view can't send images to Claude."
      : "Couldn't read a player card in that screenshot. Try a closer crop of the card.";
    if (code === "images_unavailable" || code === "not_granted") { imagesOK = false; document.body.classList.remove("has-images"); }
    state.cardRead = { status: "error", thumb, msg };
  }
  render();
}
function loadCardForm(x) {
  state.faType = x.type;
  state.fa[x.type] = { ...state.fa[x.type], ...x.f };
}

// ---------------------------------------------------------------- render & events
const VIEWS = { "free-agent": viewFreeAgent, roster: viewRoster, positions: viewPositions, lineups: viewLineups, pitching: viewPitching, guide: viewGuide };
let errorMsg = "";
function render() {
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + state.view ? "page" : "false"));
  document.getElementById("teamName").textContent = state.file ? state.team : clubName(state.club);
  document.getElementById("clubSwitch").innerHTML = `<div class="seg" role="group" aria-label="Club">${["main", "farm"].map(k => `<button type="button" data-club="${k}" aria-pressed="${state.club === k}">${esc(clubShort(k))}</button>`).join("")}</div>`;
  document.getElementById("resetBtn").style.display = state.club === "main" ? "" : "none";
  document.getElementById("fileLine").innerHTML = state.file
    ? `<b>${state.hitters.length}</b> hitters · <b>${state.pitchers.length}</b> pitchers · ${esc(state.file)}${(state.changes.log || []).length ? ` · <b>${state.changes.log.length}</b> move${state.changes.log.length === 1 ? "" : "s"} since` : ""}`
    : "No roster loaded";
  const main = document.getElementById("main");
  const prompt = !state.file ? `<div class="card upload-prompt"><h2>Upload the ${esc(clubName(state.club))}' roster</h2>
    <p style="margin:0">On curveball.gg, switch to this club, open <b>Clubhouse → Roster</b>, click <b>Export CSV</b>, then use <b>Upload roster CSV</b> above or drag the file onto this page. The page keeps each club's roster separately.${state.players.length ? ` Until then, this view only shows the ${state.players.length} player${state.players.length === 1 ? "" : "s"} you've moved here.` : ""}</p></div>` : "";
  main.innerHTML = (errorMsg ? `<div class="notice" role="alert">${esc(errorMsg)}</div>` : "") + prompt + changesBanner() + (state.players.length ? VIEWS[state.view]() : "");
  if (state.club === "farm") scheduleCallups();
  if (state.view === "free-agent" && state.players.length) renderFAResult();
}

function route() { const h = location.hash.slice(1); state.view = VIEWS[h] ? h : "roster"; render(); }
window.addEventListener("hashchange", route);

document.getElementById("main").addEventListener("click", e => {
  const s = e.target.closest("[data-sort]");
  if (s) { const k = s.dataset.sort; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === "name" || k === "pos" ? 1 : -1) }; render(); return; }
  const act = e.target.closest("[data-action]");
  if (act) { handleAction(act); return; }
  if (e.target.id === "cardPick") { document.getElementById("cardFile").click(); return; }
  const lc = e.target.closest("[data-loadcard]");
  if (lc) { const s = state.cardRead.summary && state.cardRead.summary[Number(lc.dataset.loadcard)]; if (s) { loadCardForm(s.form); faFlash = s.assumed ? esc(s.assumed) : ""; render(); } return; }
  if (e.target.id === "askFA") {
    const f = state.fa[state.faType];
    openCoach(); askCoach(`I'm looking at a free agent: ${(f.name || "this player")}. Should I sign him, and is the suggested release the right one? Explain the tradeoff.`, true);
    return;
  }
  if (e.target.closest("[data-sort-cut]")) { state.filter = "all"; state.sort = { key: "cut", dir: 1 }; render(); return; }
  const tbtn = e.target.closest("[data-fatype]");
  if (tbtn) { state.faType = tbtn.dataset.fatype; render(); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.dataset.filter; if (!["value","name","pos","ovr","tier"].includes(state.sort.key)) state.sort = { key: "value", dir: -1 }; render(); return; }
  const p = e.target.closest("[data-pid]");
  if (p) openPlayer(Number(p.dataset.pid));
});
document.getElementById("main").addEventListener("input", e => {
  if (e.target.closest("#faForm")) {
    const k = e.target.dataset.field; if (!k) return;
    if (k === "rosterLimit") { const v = parseInt(e.target.value, 10); state.rosterLimit = Number.isFinite(v) ? v : null; }
    else { const v = e.target.type === "number" ? (e.target.value === "" ? "" : Number(e.target.value)) : e.target.value; state.fa[state.faType][k] = v; faFlash = ""; }
    clearTimeout(faTimer); faTimer = setTimeout(renderFAResult, 120);
    return;
  }
  if (e.target.id === "search") {
    state.search = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById("search"); el.focus(); el.setSelectionRange(pos, pos);
  }
  if (e.target.id === "platoon" || e.target.id === "defw") {
    if (e.target.id === "platoon") state.platoon = e.target.value / 100; else state.defWeight = e.target.value / 100;
    computeAll(); render();
    const el = document.getElementById(e.target.id); el && el.focus();
  }
});
document.getElementById("main").addEventListener("change", e => {
  if (e.target.id === "cardFile") { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) readCardImage(f); return; }
  const k = e.target.dataset && e.target.dataset.farm; if (!k) return;
  state.farm[k] = k === "name" ? (e.target.value.trim() || "Farm club") : Math.max(0, parseInt(e.target.value, 10) || 0);
  saveFarm(); computeAll(); render();
});
document.getElementById("main").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("tr[data-pid], li[data-pid]")) openPlayer(Number(e.target.dataset.pid));
});
document.getElementById("overlay").addEventListener("click", closeDrawer);
document.getElementById("clubSwitch").addEventListener("click", e => {
  const b = e.target.closest("[data-club]"); if (!b || b.dataset.club === state.club) return;
  closeDrawer(); stash(); unstash(b.dataset.club); faFlash = ""; errorMsg = "";
  try { localStorage.setItem("csgg-club", state.club); } catch (_) {}
  render();
});
document.getElementById("drawer").addEventListener("click", e => {
  if (e.target.id === "closeDrawer") closeDrawer();
  const ask = e.target.closest("[data-ask]");
  if (ask) {
    const p = state.players.find(x => x.id === Number(ask.dataset.ask));
    if (p) {
      closeDrawer();
      const q = p.keep ? `Why does the page say to keep ${p.name}? What's his role, and is there any case for releasing him?`
                       : `Why is ${p.name} #${p.cutRank} in the release order? Who else could I release instead, and what would I lose?`;
      openCoach(); askCoach(q);
    }
    return;
  }
  const act = e.target.closest("[data-action]"); if (act) handleAction(act);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const prev = state.changes; resetChanges(file.name);
      try { loadRoster(String(r.result), file.name); } catch (err) { state.changes = prev; saveChanges(); throw err; }
      errorMsg = ""; faFlash = ""; callupKey = "";
      try { localStorage.setItem(LSKEY.roster(state.club), JSON.stringify({ text: r.result, name: file.name, at: Date.now() })); } catch (_) {}
    } catch (err) { errorMsg = err.message + " Your previous roster is still shown."; }
    render();
  };
  r.onerror = () => { errorMsg = "Couldn't read that file. Try exporting it again."; render(); };
  r.readAsText(file);
}
document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", e => { readFile(e.target.files[0]); e.target.value = ""; });
document.getElementById("resetBtn").addEventListener("click", () => {
  resetChanges(SAMPLE_FILE); loadRoster(SAMPLE_CSV, SAMPLE_FILE); errorMsg = ""; faFlash = "";
  try { localStorage.removeItem("csgg-roster"); } catch (_) {}
  render();
});
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (/^image\//.test(f.type)) readCardImage(f); else readFile(f);
});
document.addEventListener("paste", e => {
  if (!imagesOK) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === "file" && /^image\//.test(i.type));
  if (!item) return;
  e.preventDefault();
  readCardImage(item.getAsFile());
});

// Start with the last uploaded roster in this browser, or the sample.
(function init() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("csgg-roster") || "null"); } catch (_) {}
  if (saved && !(saved.at > SAMPLE_AT)) saved = null; // a newer read from Claude replaces an older upload
  let ch = null;
  try { ch = JSON.parse(localStorage.getItem("csgg-changes") || "null"); } catch (_) {}
  const file = saved ? saved.name : SAMPLE_FILE;
  state.changes = ch && ch.file === file ? ch : { file, added: [], released: [] };
  try { if (saved) loadRoster(saved.text, saved.name); else loadRoster(SAMPLE_CSV, SAMPLE_FILE); }
  catch (_) { state.changes = freshChanges(SAMPLE_FILE); loadRoster(SAMPLE_CSV, SAMPLE_FILE); }
  // The farm club, if one has been uploaded or players were moved there.
  let fr = null, fch = null;
  try { fr = JSON.parse(localStorage.getItem(LSKEY.roster("farm")) || "null"); } catch (_) {}
  try { fch = JSON.parse(localStorage.getItem(LSKEY.changes("farm")) || "null"); } catch (_) {}
  let fbase = null;
  try { if (fr) fbase = parseRosterText(fr.text); } catch (_) { fr = null; }
  const ffile = fr ? fr.name : "";
  state.clubs.farm = { base: fbase, file: ffile, team: fr ? teamFromFile(ffile) : state.farm.name, changes: fch && fch.file === ffile ? fch : freshChanges(ffile) };
  if (state.clubs.farm.team === "Scouting Desk") state.clubs.farm.team = state.farm.name;
  computeAll(); // farm room is known now
  let last = "main"; try { last = localStorage.getItem("csgg-club") || "main"; } catch (_) {}
  if (last === "farm") { stash(); unstash("farm"); }
  route();
})();
