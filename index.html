<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stovepipes Scouting Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a manager's scouting desk. Scoreboard header, tabbed boards below,
   every player reduced to letter grades and plain-English tags. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --ink: #15211a;
  --muted: #5a6b60;
  --line: #d6dfd8;
  --accent: #0f5c3a;
  --accent-ink: #ffffff;
  --g-a: #16794a; --g-a-bg: #e2f3e9;
  --g-b: #1f5f99; --g-b-bg: #e3eef8;
  --g-c: #8a6400; --g-c-bg: #fbf1d6;
  --g-d: #a8322b; --g-d-bg: #fbe5e3;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1611; --surface: #142019; --ink: #e6eee8; --muted: #93a79a; --line: #24372c;
    --accent: #f0bf4c; --accent-ink: #1b1505;
    --g-a: #5fd39a; --g-a-bg: #133324;
    --g-b: #7ab6ef; --g-b-bg: #14283b;
    --g-c: #f0c45a; --g-c-bg: #332a10;
    --g-d: #f08a80; --g-d-bg: #3a1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1611; --surface: #142019; --ink: #e6eee8; --muted: #93a79a; --line: #24372c;
  --accent: #f0bf4c; --accent-ink: #1b1505;
  --g-a: #5fd39a; --g-a-bg: #133324;
  --g-b: #7ab6ef; --g-b-bg: #14283b;
  --g-c: #f0c45a; --g-c-bg: #332a10;
  --g-d: #f08a80; --g-d-bg: #3a1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Header */
header.board { background: #10261a; color: #f1f5f0; border-bottom: 4px solid #f0bf4c; }
.board-inner { max-width: 1240px; margin: 0 auto; padding: 18px 20px 14px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; }
.board h1 { font: 700 34px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.board .sub { font: 500 13px/1.3 var(--font-num); color: #b7c9bc; margin-top: 6px; }
.board .sub b { color: #f0bf4c; font-weight: 500; }
.upload { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: #f0bf4c; color: #1b1505; border-color: #f0bf4c; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: #d7e3da; border-color: #3c5a47; }
.drop-hint { font-size: 12px; color: #9fb4a5; }
body.dragging::after { content: "Drop a roster CSV or a card screenshot"; position: fixed; inset: 0; display: grid; place-items: center; background: rgba(13,30,20,.82); color: #f0bf4c; font: 700 34px var(--font-display); text-transform: uppercase; letter-spacing: .05em; z-index: 50; }

nav.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.tabs-inner { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
.tabs a { padding: 12px 14px; text-decoration: none; color: var(--muted); font: 600 16px var(--font-display); letter-spacing: .06em; text-transform: uppercase; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a:hover { color: var(--ink); }

main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }
.notice { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--g-d); background: var(--g-d-bg); color: var(--ink); margin-bottom: 16px; }
.notice.info { border-color: var(--line); background: var(--surface); }
h2 { font: 700 24px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; text-wrap: balance; }
h3 { font: 700 18px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .05em; margin: 0; }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .k { font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-weight: 600; font-size: 16px; }
.tile .d { font-size: 13px; color: var(--muted); }

/* Grades */
.gr { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; padding: 1px 6px; border-radius: 5px; font: 600 13px var(--font-num); }
.gr.a { color: var(--g-a); background: var(--g-a-bg); }
.gr.b { color: var(--g-b); background: var(--g-b-bg); }
.gr.c { color: var(--g-c); background: var(--g-c-bg); }
.gr.d { color: var(--g-d); background: var(--g-d-bg); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.plus { border-color: color-mix(in srgb, var(--g-a) 45%, transparent); color: var(--g-a); }
.tag.minus { border-color: color-mix(in srgb, var(--g-d) 45%, transparent); color: var(--g-d); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.btn.primary-green { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--g-d); border-color: color-mix(in srgb, var(--g-d) 50%, transparent); }
.notice.changes { display: grid; gap: 8px; }
.pill { display: inline-block; font: 600 12px var(--font-body); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.keep { color: var(--g-a); background: var(--g-a-bg); }
.pill.depth { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.pill.cut { color: var(--g-d); background: var(--g-d-bg); }
.pill.farm { color: var(--g-b); background: var(--g-b-bg); }
.pill.callup { color: var(--accent-ink); background: var(--accent); }
.clubs { margin-left: auto; align-self: center; display: flex; gap: 8px; align-items: center; padding-left: 12px; }
.clubs .seg button { padding: 5px 12px; font-weight: 600; white-space: nowrap; }
.upload-prompt { max-width: 640px; }
.farm-card { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.farm-card .field { min-width: 120px; }
.fa-layout { display: grid; gap: 16px; grid-template-columns: minmax(300px, 400px) 1fr; align-items: start; }
@media (max-width: 860px) { .fa-layout { grid-template-columns: 1fr; } }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.field { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 6px 8px; width: 100%; }
.field input[type="number"] { font-family: var(--font-num); }
.field.wide { grid-column: 1 / -1; }
.verdict { border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; border: 1px solid var(--line); }
.verdict .big { font: 700 30px/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.verdict.sign { background: var(--g-a-bg); border-color: color-mix(in srgb, var(--g-a) 40%, transparent); }
.verdict.sign .big { color: var(--g-a); }
.verdict.maybe { background: var(--g-c-bg); border-color: color-mix(in srgb, var(--g-c) 40%, transparent); }
.verdict.maybe .big { color: var(--g-c); }
.verdict.pass { background: var(--g-d-bg); border-color: color-mix(in srgb, var(--g-d) 40%, transparent); }
.verdict.pass .big { color: var(--g-d); }
ul.points { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
table.compare td, table.compare th { padding: 6px 10px; }
table.compare tbody tr { cursor: default; }

/* Tables */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
input[type="search"] { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 10px; min-width: 180px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th[aria-sort="descending"]::after { content: " ▼"; }
th[aria-sort="ascending"]::after { content: " ▲"; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
td.c, th.c { text-align: center; }
.name { font-weight: 600; white-space: nowrap; }
.pos { font: 500 13px var(--font-num); color: var(--muted); white-space: nowrap; }
.rank { font: 600 13px var(--font-num); color: var(--muted); }

/* Value bar */
.bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.bar i { display: block; height: 7px; border-radius: 4px; background: var(--accent); }
.bar .track { flex: 1; background: var(--line); border-radius: 4px; height: 7px; overflow: hidden; }

/* Cards / grids */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-head .meta { font-size: 12px; color: var(--muted); }
ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.list li { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
ol.list li:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
ol.list li.top { background: color-mix(in srgb, var(--accent) 12%, transparent); }
ol.list .sec { font-size: 11px; color: var(--muted); margin-left: 4px; }

/* Lineup cards */
.lineups { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.order li { grid-template-columns: 22px 1fr 36px auto; }
.order .who { display: grid; }
.order .role { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.subhead { font: 600 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.subs { display: grid; gap: 4px; font-size: 13.5px; }
.subs div { display: block; }
.subs b { font-weight: 600; }
.bench { font-size: 13px; color: var(--muted); }
.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; margin-bottom: 16px; }
.settings label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.settings output { font: 600 13px var(--font-num); color: var(--ink); }
input[type="range"] { accent-color: var(--accent); width: 180px; }

/* Rest status */
.rest { font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.rest::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--g-a); }
.rest.tired::before { background: var(--g-c); }

/* Drawer */
.overlay { position: fixed; inset: 0; background: rgba(5,12,8,.55); display: none; z-index: 40; }
.overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 41; transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 18px 20px 40px; display: grid; gap: 14px; align-content: start; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer h2 { font-size: 28px; }
.drawer .close { position: absolute; top: 12px; right: 12px; }
.summary { font-size: 14.5px; line-height: 1.55; max-width: 65ch; }
.ratings { display: grid; gap: 6px; }
.rating { display: grid; grid-template-columns: 120px 1fr 30px 40px; align-items: center; gap: 8px; font-size: 13.5px; }
.rating .track { background: var(--line); border-radius: 4px; height: 7px; overflow: hidden; }
.rating .fill { height: 100%; border-radius: 4px; }
.fill.a { background: var(--g-a); } .fill.b { background: var(--g-b); } .fill.c { background: var(--g-c); } .fill.d { background: var(--g-d); }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font: 600 15px var(--font-num); }

/* Ask Claude */
.needs-claude { display: none !important; }
body.has-claude .needs-claude { display: inline-flex !important; }
body.has-claude .needs-claude.block { display: grid !important; }
.coach { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100% - 32px)); height: min(600px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); z-index: 45; display: none; grid-template-rows: auto 1fr auto; overflow: hidden; }
.coach.open { display: grid; }
.coach-head { background: #10261a; color: #f1f5f0; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 3px solid #f0bf4c; }
.coach-head h3 { color: #f1f5f0; }
.coach-head .btn { padding: 3px 10px; background: transparent; color: #d7e3da; border-color: #3c5a47; }
.coach-log { overflow-y: auto; padding: 14px; display: grid; gap: 10px; align-content: start; }
.msg { padding: 9px 12px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; max-width: 92%; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); }
.msg.ai { justify-self: start; background: var(--bg); border: 1px solid var(--line); }
.msg.ai p { margin: 0 0 6px; } .msg.ai p:last-child { margin: 0; }
.msg.ai ul { margin: 4px 0 6px; padding-left: 18px; }
.msg.err { background: var(--g-d-bg); color: var(--ink); border: 1px solid var(--g-d); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); }
.coach-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.coach-form textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; height: 44px; }
.ask-fab { position: fixed; right: 16px; bottom: 16px; z-index: 44; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

/* Card reader */
.needs-images { display: none !important; }
body.has-images .needs-images { display: grid !important; }
.reader { border: 2px dashed var(--line); border-radius: 10px; padding: 12px 14px; gap: 8px; background: var(--surface); margin-bottom: 14px; }
.reader.busy { border-color: var(--accent); }
.reader img { max-height: 90px; max-width: 160px; border-radius: 6px; border: 1px solid var(--line); }
.reader .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
table.pack td, table.pack th { padding: 6px 10px; }
table.pack tbody tr { cursor: default; }

/* Guide */
.guide { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.guide dl { margin: 0; display: grid; gap: 8px; }
.guide dt { font-weight: 600; }
.guide dd { margin: 0; color: var(--muted); font-size: 14px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
@media (max-width: 520px) {
  .board h1 { font-size: 28px; }
  main { padding: 16px 16px 50px; }
  .rating { grid-template-columns: 96px 1fr 26px 38px; }
  .statgrid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<header class="board">
  <div class="board-inner">
    <div>
      <h1 id="teamName">Scouting Desk</h1>
      <div class="sub" id="fileLine">No roster loaded</div>
    </div>
    <div class="upload">
      <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
      <button class="btn primary" id="uploadBtn" type="button">Upload roster CSV</button>
      <button class="btn ghost" id="resetBtn" type="button">Use Claude's latest read</button>
      <span class="drop-hint">or drag the file onto the page</span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <a href="#roster">Rankings</a>
    <a href="#positions">By position</a>
    <a href="#lineups">Lineups</a>
    <a href="#pitching">Pitching</a>
    <a href="#free-agent">Free agents</a>
    <a href="#guide">How grades work</a>
    <div class="clubs" id="clubSwitch"></div>
  </div>
</nav>
<main id="main"></main>

<button class="btn primary ask-fab needs-claude" id="askFab" type="button">Ask Claude</button>
<section class="coach" id="coach" aria-label="Ask Claude about your roster">
  <div class="coach-head"><h3>Ask Claude</h3><span style="display:flex;gap:6px"><button class="btn" type="button" id="coachClear">New chat</button><button class="btn" type="button" id="coachClose">Close</button></span></div>
  <div class="coach-log" id="coachLog" aria-live="polite"></div>
  <form class="coach-form" id="coachForm"><label for="coachInput" class="small" style="position:absolute;left:-9999px">Your question</label><textarea id="coachInput" placeholder="Why should I drop Phelps instead of Choi?"></textarea><button class="btn primary" type="submit">Ask</button></form>
</section>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Player details"></aside>

<script>

// ---------------------------------------------------------------- csv
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.some(c => c !== "")) rows.push(row); row = [];
    } else f += ch;
  }
  row.push(f); if (row.some(c => c !== "")) rows.push(row);
  return rows;
}

function loadRoster(text, fileName) {

function parseRosterText(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (!rows.length) throw new Error("That file is empty.");
  const head = rows[0].map(h => h.trim());
  const ix = {}; head.forEach((h, i) => ix[h] = i);
  if (ix["Name"] == null || ix["Type"] == null) throw new Error("This doesn't look like a curveball.gg roster export: it needs Name and Type columns.");
  const s = (r, k) => (ix[k] == null ? "" : String(r[ix[k]] ?? "").trim());
  const n = (r, k) => { const v = parseFloat(s(r, k)); return Number.isFinite(v) ? v : null; };
  const z = (r, k) => n(r, k) ?? 0;
  const players = [];
  rows.slice(1).forEach((r, i) => {
    const type = s(r, "Type"); if (!s(r, "Name")) return;
    const base = {
      id: i, name: s(r, "Name"), type, pos1: s(r, "Primary position"), pos2: s(r, "Secondary position"),
      age: n(r, "Age"), bats: s(r, "Bats"), throws: s(r, "Throws"), tier: s(r, "Pack tier"), prime: s(r, "Prime"),
      ovr: z(r, "Overall (OVR)"),
      range: z(r, "Fielding range"), handling: z(r, "Handling"), arm: z(r, "Arm strength"), flex: z(r, "Flexibility"),
      speed: z(r, "Speed"), aggr: z(r, "Aggression"), aware: z(r, "Awareness"),
      g: z(r, "Games (G)"),
      availableAt: s(r, "Available at (UTC)"),
    };
    if (type === "Hitter") {
      Object.assign(base, {
        contact: z(r, "Contact"), power: z(r, "Power"), eye: z(r, "Plate discipline"), bunt: z(r, "Bunting"),
        stats: { PA: n(r, "Plate appearances (PA)"), AVG: n(r, "Batting average (AVG)"), OBP: n(r, "On-base pct (OBP)"), SLG: n(r, "Slugging (SLG)"), OPS: n(r, "OPS"), HR: n(r, "Home runs (HR)"), RBI: n(r, "Runs batted in (RBI)"), SB: n(r, "Stolen bases (SB)"), BB: n(r, "Walks (BB)"), SO: n(r, "Strikeouts (SO)") },
        splits: { L: [n(r, "AVG vs LHP"), n(r, "OBP vs LHP"), n(r, "SLG vs LHP")], R: [n(r, "AVG vs RHP"), n(r, "OBP vs RHP"), n(r, "SLG vs RHP")] },
      });
    } else if (type === "Pitcher") {
      Object.assign(base, {
        velo: z(r, "Velocity"), acc: z(r, "Accuracy"), fin: z(r, "Finesse"), end: z(r, "Endurance"),
        stats: { IP: n(r, "Innings pitched (IP)"), W: n(r, "Wins (W)"), L: n(r, "Losses (L)"), SV: n(r, "Saves (SV)"), ERA: n(r, "ERA"), WHIP: n(r, "WHIP"), K9: n(r, "K/9"), BB9: n(r, "BB/9"), SO: n(r, "Strikeouts") },
        splits: { L: [n(r, "ERA vs LHB"), n(r, "WHIP vs LHB")], R: [n(r, "ERA vs RHB"), n(r, "WHIP vs RHB")] },
      });
    } else return;
    players.push(base);
  });
  if (!players.length) throw new Error("No hitters or pitchers found in that file.");
  return players;
}

function buildPlayers(base, c) {

function sendToOther(p) {
  const k = otherClub();

  const raw = JSON.parse(JSON.stringify(p));

  (c.changes.log = c.changes.log || []).push({ kind: "receive", name: p.name, type: p.type, from: clubShort(state.club) });

}
function unsendToOther(name) {
  const c = state.clubs[otherClub()]; if (!c) return;
  for (let i = c.changes.added.length - 1; i >= 0; i--) if (c.changes.added[i].player && c.changes.added[i].player.name === name) { c.changes.added.splice(i, 1); break; }
  const li = (c.changes.log || []).map(x => x.kind === "receive" && x.name === name).lastIndexOf(true);
  if (li >= 0) c.changes.log.splice(li, 1);
  saveChangesFor(otherClub(), c.changes);
}
function recordSign(f, type) { state.changes.added.push({ f: { ...f }, type, at: Date.now() }); state.changes.log = state.changes.log || []; state.changes.log.push({ kind: "sign", name: f.name || "Free agent", type }); }
function recordRelease(p, kind = "release") {

    state.changes.released.push(p.type + "|" + p.name);
    state.changes.log.push({ kind, name: p.name, type: p.type, key: p.type + "|" + p.name });

}
function undoLast() {
  const c = state.changes, last = (c.log || []).pop(); if (!last) return;

  else if (last.restore) c.added.push(last.restore);

function teamFromFile(f) {
  const m = f.replace(/\.csv$/i, "").replace(/-roster.*$/i, "");
  if (!m || m === f.replace(/\.csv$/i, "")) return state.club === "farm" ? state.farm.name : "Scouting Desk";
  return m.split(/[-_ ]+/).map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
}

// ---------------------------------------------------------------- the math
const onBase = h => .5 * h.contact + .5 * h.eye;
const powerS = h => .7 * h.power + .3 * h.contact;
const running = p => .6 * p.speed + .4 * p.aware;
function bat(h, mode = "ALL") {
  let v = mode === "POWER" ? .25 * onBase(h) + .65 * powerS(h) + .10 * running(h)
                           : .45 * onBase(h) + .40 * powerS(h) + .15 * running(h);
  if (mode === "RHP" && (h.bats === "L" || h.bats === "S")) v *= 1 + state.platoon;
  if (mode === "LHP" && (h.bats === "R" || h.bats === "S")) v *= 1 + state.platoon;
  return v;
}
const canPlay = (h, pos) => pos === "DH" || h.pos1 === pos || h.pos2 === pos;
function glove(h, pos) {
  const prof = DEF_PROFILES[pos]; if (!prof) return 0;
  let v = 0; for (const k in prof) v += prof[k] * h[k];
  return h.pos1 === pos ? v : v * (1 - SECONDARY_PENALTY);
}
const defW = mode => mode === "POWER" ? 0.10 : state.defWeight;
function slot(h, pos, mode) { const w = defW(mode); return pos === "DH" ? (1 - w) * bat(h, mode) : (1 - w) * bat(h, mode) + w * glove(h, pos); }

const stuff = p => .38 * p.velo + .32 * p.acc + .30 * p.fin;
const starter = p => .8 * stuff(p) + .2 * p.end;

function computeAll() {
  state.hitters.forEach(h => {
    h.ob = onBase(h); h.pw = powerS(h); h.run = running(h); h.bat = bat(h);
    const spots = FIELD.filter(p => canPlay(h, p));
    h.bestPos = spots.sort((a, b) => glove(h, b) - glove(h, a))[0] || "DH";
    h.glove = glove(h, h.bestPos);
    h.value = .75 * h.bat + .25 * h.glove;
  });
  state.pitchers.forEach(p => {
    p.stuff = stuff(p); p.sp = starter(p);
    p.canStart = p.end >= MIN_SP_END;
    p.value = p.canStart ? Math.max(p.sp, p.stuff * .97) : p.stuff;
  });
  state.lineups = { RHP: buildLineup("RHP"), LHP: buildLineup("LHP"), POWER: buildLineup("POWER") };
  state.staff = buildStaff();
  assignRoles();
  computeStatus();
}

function buildLineup(mode) {
  const H = state.hitters;
  const cand = {};
  FIELD.forEach(pos => cand[pos] = H.filter(h => canPlay(h, pos)).sort((a, b) => slot(b, pos, mode) - slot(a, pos, mode)));
  const order = [...FIELD].sort((a, b) => cand[a].length - cand[b].length);
  const ceil = order.map(pos => cand[pos][0] ? slot(cand[pos][0], pos, mode) : 0);
  const bestDH = Math.max(0, ...H.map(h => slot(h, "DH", mode)));
  let best = { total: -Infinity, picks: {} };
  const used = new Set(), picks = {};
  (function search(i, total) {
    let c = total + bestDH; for (let k = i; k < order.length; k++) c += ceil[k];
    if (c <= best.total) return;
    if (i === order.length) {
      const dh = H.filter(h => !used.has(h.id)).sort((a, b) => slot(b, "DH", mode) - slot(a, "DH", mode))[0];
      const t = total + (dh ? slot(dh, "DH", mode) : 0);
      if (t > best.total) best = { total: t, picks: { ...picks, DH: dh } };
      return;
    }
    const pos = order[i]; let any = false;
    for (const h of cand[pos]) {
      if (used.has(h.id)) continue; any = true;
      used.add(h.id); picks[pos] = h; search(i + 1, total + slot(h, pos, mode)); used.delete(h.id); delete picks[pos];
    }
    if (!any) search(i + 1, total);
  })(0, 0);

  const nine = ALL_POS.filter(pos => best.picks[pos]).map(pos => {
    const h = best.picks[pos];
    return { h, pos, b: bat(h, mode), gl: glove(h, pos) };
  });
  // Batting order: three best bats hit 1, 2, 4. Best on-base of them leads off, most power hits cleanup.
  const pool = [...nine].sort((a, b) => b.b - a.b);
  const lineup = new Array(9);
  const top3 = pool.splice(0, 3);
  top3.sort((a, b) => b.h.ob - a.h.ob); lineup[0] = { ...top3.shift(), role: "Leadoff: best on-base of your top 3" };
  top3.sort((a, b) => b.h.pw - a.h.pw); lineup[3] = { ...top3.shift(), role: "Cleanup: most power of your top 3" };
  lineup[1] = { ...top3.shift(), role: "Top-3 bat" };
  const next2 = pool.splice(0, 2).sort((a, b) => a.h.pw - b.h.pw);
  if (next2[0]) lineup[2] = { ...next2[0], role: "Next-best bat" };
  if (next2[1]) lineup[4] = { ...next2[1], role: "Next-best bat, more power" };
  for (let i = 5; i < 9 && pool.length; i++) lineup[i] = { ...pool.shift(), role: "" };
  const order9 = lineup.filter(Boolean);
  const inIds = new Set(order9.map(x => x.h.id));
  const bench = H.filter(h => !inIds.has(h.id));

  // Bench suggestions
  // Bench suggestions. A sub takes over the starter's position, so he must be able to play it (anyone can replace the DH).
  const subs = { def: [], runners: [], hitters: [] };
  const fits = (h, s) => s.pos === "DH" || canPlay(h, s.pos);
  order9.forEach(s => {
    if (s.pos !== "DH") {
      const alt = bench.filter(h => canPlay(h, s.pos)).sort((a, b) => glove(b, s.pos) - glove(a, s.pos))[0];
      if (alt && glove(alt, s.pos) - s.gl >= 4) subs.def.push({ out: s.h, inn: alt, pos: s.pos, gain: glove(alt, s.pos) - s.gl });
    }
    const r = bench.filter(h => fits(h, s)).sort((a, b) => b.run - a.run)[0];
    if (r && r.run - s.h.run >= 8) subs.runners.push({ out: s.h, inn: r, pos: s.pos, gain: r.run - s.h.run });
    const ph = bench.filter(h => fits(h, s)).sort((a, b) => bat(b, mode) - bat(a, mode))[0];
    if (ph && bat(ph, mode) - s.b >= 3) subs.hitters.push({ out: s.h, inn: ph, pos: s.pos, gain: bat(ph, mode) - s.b });
  });
  const uniq = list => { const u = new Set(); return list.sort((a, b) => b.gain - a.gain).filter(d => (u.has(d.inn.id) ? false : (u.add(d.inn.id), true))).slice(0, 3); };
  subs.def = uniq(subs.def); subs.runners = uniq(subs.runners); subs.hitters = uniq(subs.hitters);
  return { order: order9, bench, subs, total: best.total };
}

function buildStaff() {
  const P = state.pitchers, used = new Set(), staff = [];
  const rot = P.filter(p => p.canStart).sort((a, b) => b.sp - a.sp).slice(0, 5);
  rot.forEach((p, i) => { used.add(p.id); staff.push({ p, group: "Rotation", label: `SP${i + 1}`, score: p.sp }); });
  const pen = P.filter(p => !used.has(p.id)).sort((a, b) => b.stuff - a.stuff);
  pen.splice(0, 2).forEach((p, i) => staff.push({ p, group: "Closers", label: `CL${i + 1}`, score: p.stuff }));
  pen.forEach((p, i) => staff.push({ p, group: "Bullpen order", label: `${i + 1}`, mop: i >= pen.length - 2, score: p.stuff }));
  return staff;
}

function assignRoles() {
  const L = state.lineups;
  state.hitters.forEach(h => {
    const inR = L.RHP.order.some(s => s.h.id === h.id), inL = L.LHP.order.some(s => s.h.id === h.id);
    const d = L.RHP.subs.def.find(x => x.inn.id === h.id);
    if (inR && inL) h.role = "Everyday starter";
    else if (inR) h.role = "Starts vs right-handers";
    else if (inL) h.role = "Starts vs left-handers";
    else if (d) h.role = `Late-inning glove (${d.pos})`;
    else if (L.RHP.subs.runners.some(x => x.inn.id === h.id)) h.role = "Pinch runner";
    else if (L.RHP.subs.hitters.some(x => x.inn.id === h.id)) h.role = "Pinch hitter";
    else h.role = "Depth";
  });
  state.staff.forEach(s => {
    s.p.role = s.group === "Rotation" ? `Starter (${s.label})` : s.group === "Closers" ? `Closer (${s.label})` : s.mop ? "Mop-up reliever" : `Reliever (#${s.label} in pen)`;
  });
}

// ---------------------------------------------------------------- roster spots / release candidates
// Players who start, sub, back up a position, pitch in the rotation, close, or sit in the top 6 of the
// bullpen are kept. Everyone else gets a release order, weakest Value first.
const KEEP_PEN = 6;
function computeStatus() {
  const L = state.lineups;
  const inLine = (m, id) => L[m].order.some(s => s.h.id === id);
  const subIds = new Set();
  ["RHP", "LHP"].forEach(m => [...L[m].subs.def, ...L[m].subs.runners, ...L[m].subs.hitters].forEach(d => subIds.add(d.inn.id)));
  const teamGames = Math.max(0, ...state.players.map(p => p.g || 0));

  state.hitters.forEach(h => {
    h.keep = true; h.cutRank = null;
    const r = inLine("RHP", h.id), l = inLine("LHP", h.id);
    if (r && l) h.why = "Starts every day";
    else if (r || l) h.why = `Starts vs ${r ? "right" : "left"}-handers`;
    else if (inLine("POWER", h.id)) h.why = "Starts in the power lineup";
    else if (subIds.has(h.id)) h.why = "Late-inning sub";
    else { h.keep = false; h.why = "Not in any lineup and not a recommended sub"; }
  });
  // Make sure every position has at least one backup who isn't starting vs right-handers.
  const rhpIds = new Set(L.RHP.order.map(s => s.h.id));
  FIELD.forEach(pos => {
    const covered = state.hitters.some(h => h.keep && !rhpIds.has(h.id) && canPlay(h, pos));
    if (covered) return;
    const b = state.hitters.filter(h => !h.keep && canPlay(h, pos)).sort((a, c) => (.5 * bat(c) + .5 * glove(c, pos)) - (.5 * bat(a) + .5 * glove(a, pos)))[0];
    if (b) { b.keep = true; b.why = `Only backup ${pos} worth keeping`; }
  });
  state.staff.forEach(s => {
    const p = s.p;
    p.cutRank = null;
    if (s.group !== "Bullpen order") { p.keep = true; p.why = s.group === "Rotation" ? "In the rotation" : "Closer"; }
    else if (Number(s.label) <= KEEP_PEN) { p.keep = true; p.why = `Bullpen arm #${s.label}`; }
    else { p.keep = false; p.why = "Back of the bullpen: rarely pitches"; }
  });
  const locked = new Set(state.club === "main" && state.file === SAMPLE_FILE ? SAMPLE_LOCKED : []);
  state.players.forEach(p => { p.locked = locked.has(p.name); if (p.locked && !p.keep) { p.keep = true; p.why = "Locked in the game, so he can't be released"; } });
  // Players who aren't needed here: the ones with the most upside go to the farm club (as many as it
  // has room for) so they get playing time; the rest are release candidates.
  const cands = state.players.filter(p => !p.keep);
  state.players.forEach(p => { p.move = null; p.upside = upsideScore(p); p.callup = state.club === "farm" ? state.callups.get(p.name) || null : null; });
  if (state.club === "farm") {
    // On the farm club, extras just sit on the bench unless the roster is full.
    const full = state.players.length >= ROSTER_MAX;
    cands.sort((a, b) => a.value - b.value).forEach((p, i) => { p.cutRank = i + 1; p.move = full ? "release" : "bench"; p.why += full ? ". The roster is full, so he's first to go if you need a spot" : ". Fine to keep as depth while there's room"; });
    return;
  }
  let { players: open, pitchers: openP } = farmOpen();
  [...cands].sort((a, b) => b.upside - a.upside).forEach(p => {
    if (open > 0 && (p.type !== "Pitcher" || openP > 0)) { p.move = "transfer"; open--; if (p.type === "Pitcher") openP--; }
    else p.move = "release";
  });
  const order = [...cands.filter(p => p.move === "release").sort((a, b) => a.value - b.value),
                 ...cands.filter(p => p.move === "transfer").sort((a, b) => a.upside - b.upside)];
  order.forEach((p, i) => {
    p.cutRank = i + 1;
    p.why += p.move === "transfer"
      ? `. He won't play here, so send him to the ${clubName("farm")} for ${p.type === "Pitcher" ? "innings" : "at-bats"} instead of releasing him`
      : `. Not enough room on the ${clubName("farm")} for him, and he has the least upside of the extras, so release him when you need a spot`;
    if (teamGames >= 10 && !p.g) p.why += `; 0 games so far`;
  });
}
// Call-ups: for each farm player, add him to the Stovepipes as a test and see whether he'd earn a real role.
let callupKey = "", callupBusy = false;
function scheduleCallups() {
  if (state.club !== "farm" || !state.players.length) return;
  const mc = state.clubs.main; if (!mc || !mc.base) { state.callups = new Map(); return; }
  const key = JSON.stringify([mc.file, (mc.changes.log || []).length, state.file, (state.changes.log || []).length, state.players.length]);
  if (key === callupKey || callupBusy) return;
  callupBusy = true;
  setTimeout(() => {
    const result = new Map();
    const save = { players: state.players, hitters: state.hitters, pitchers: state.pitchers, file: state.file, club: state.club, callups: state.callups };
    try {
      const mainPlayers = buildPlayers(mc.base, mc.changes);
      state.club = "main"; state.file = mc.file; state.callups = new Map();
      for (const fp of save.players) {
        const test = JSON.parse(JSON.stringify(fp)); test.id = -1;
        state.players = [...mainPlayers, test];
        state.hitters = state.players.filter(p => p.type === "Hitter");
        state.pitchers = state.players.filter(p => p.type === "Pitcher");
        computeAll();
        if (test.keep && /^(Starts|In the rotation|Closer|Bullpen arm|Late-inning)/.test(test.why))
          result.set(fp.name, `Would earn a role on the ${clubName("main")}: ${test.why.toLowerCase()}.`);
      }
    } catch (_) {}
    state.players = save.players; state.hitters = save.hitters; state.pitchers = save.pitchers; state.file = save.file; state.club = save.club;
    state.callups = result; callupKey = key; callupBusy = false;
    computeAll(); render();
  }, 30);
}

// Upside: current Value plus youth, pack tier and a standout rating. Used only to decide transfer vs release.
function upsideScore(p) {
  const peak = p.type === "Hitter" ? Math.max(p.contact, p.power, p.eye, p.speed, p.range, p.arm) : Math.max(p.velo, p.acc, p.fin);
  return p.value + 1.5 * Math.max(0, 22 - (p.age ?? 20)) + ({ Gold: 3, Blue: 1.5 }[p.tier] || 0) + (peak >= 55 ? 1.5 : 0);
}
const RELEASE_FLAG = 4;
function statusHTML(p) {
  if (p.callup) return `<span class="pill callup" title="${esc(p.callup)}">Call up</span>`;
  if (p.move === "bench") return `<span class="pill depth" title="${esc(p.why)}">Bench</span>`;
  if (p.keep) return `<span class="pill keep" title="${esc(p.why)}">Keep${p.locked ? " 🔒" : ""}</span>`;
  if (p.move === "transfer") return `<span class="pill farm" title="${esc(p.why)}">Send to ${esc(clubShort("farm"))}</span>`;
  return `<span class="pill cut" title="${esc(p.why)}">Release</span>`;
}

// ---------------------------------------------------------------- tags & summaries
function hitterTags(h) {
  const t = [];
  if (h.power >= 55) t.push(["Slugger", "plus", "Power 55+: lifts the ball for extra bases and homers."]);
  if (h.contact >= 55) t.push(["Contact bat", "plus", "Contact 55+: few swings and misses, lots of line drives."]);
  if (h.eye >= 54) t.push(["Good eye", "plus", "Plate discipline 54+: draws walks and squares the ball up."]);
  if (h.speed >= 50) t.push(["Speed threat", "plus", "Speed 50+: beats out infield hits and takes extra bases."]);
  if (h.bunt >= 55) t.push(["Bunter", "plus", "Bunting 55+: gets the bunt down reliably."]);
  if (h.arm >= 52) t.push(["Strong arm", "plus", "Arm 52+: throws out runners."]);
  if (["2B", "SS", "3B", "1B"].some(p => canPlay(h, p)) && h.flex >= 52) t.push(["Turns two", "plus", "Flexibility 52+ at an infield spot: helps turn double plays."]);
  if (h.glove >= 50 && h.bat < 46) t.push(["Glove-first", "", "Fields well but the bat lags behind."]);
  if (h.bat >= 50 && h.glove < 42) t.push(["Bat-first", "", "Hits well but is a liability in the field. A DH candidate."]);
  if (h.aggr >= 55) t.push(["Aggressive", "", "Aggression 55+: pulls the ball and runs hard, sometimes into outs."]);
  if (h.eye < 40) t.push(["Free swinger", "minus", "Plate discipline under 40: chases bad pitches, few walks."]);
  if (h.contact < 40) t.push(["Swing and miss", "minus", "Contact under 40: strikes out a lot."]);
  if (h.speed < 32) t.push(["Slow", "minus", "Speed under 32: easy to double up."]);
  if (h.bats === "S") t.push(["Switch-hitter", "", "Bats from both sides."]);
  return t;
}
function pitcherTags(p) {
  const t = [];
  if (p.velo >= 55) t.push(["Power arm", "plus", "Velocity 55+: misses bats and racks up strikeouts."]);
  if (p.acc >= 55) t.push(["Command", "plus", "Accuracy 55+: rarely walks anyone."]);
  if (p.fin >= 55) t.push(["Deceptive", "plus", "Finesse 55+: movement misses bats and keeps runners close."]);
  if (p.end >= 70) t.push(["Workhorse", "plus", "Endurance 70+: can go deep into games."]);
  if (p.end < 42) t.push(["Short stints", "", "Endurance under 42: best in one-inning relief."]);
  if (p.acc < 40) t.push(["Wild", "minus", "Accuracy under 40: walks and wild pitches."]);
  if (p.velo < 35) t.push(["Soft-tosser", "minus", "Velocity under 35: relies on location and movement."]);
  if (p.throws === "L") t.push(["Lefty", "", "Throws left-handed."]);
  return t;
}
const tagsFor = p => p.type === "Hitter" ? hitterTags(p) : pitcherTags(p);
const tagHTML = (t, max = 99) => `<span class="tags">${t.slice(0, max).map(([l, c, d]) => `<span class="tag ${c}" title="${esc(d)}">${esc(l)}</span>`).join("")}</span>`;

function ratingList(p) {
  return p.type === "Hitter"
    ? [["Contact", p.contact], ["Power", p.power], ["Plate discipline", p.eye], ["Bunting", p.bunt], ["Speed", p.speed], ["Awareness", p.aware], ["Aggression", p.aggr], ["Fielding range", p.range], ["Handling", p.handling], ["Arm strength", p.arm], ["Flexibility", p.flex]]
    : [["Velocity", p.velo], ["Accuracy", p.acc], ["Finesse", p.fin], ["Endurance", p.end], ["Fielding range", p.range], ["Handling", p.handling], ["Arm strength", p.arm]];
}
function summary(p) {
  const core = p.type === "Hitter"
    ? [["contact", p.contact], ["power", p.power], ["plate discipline", p.eye], ["speed", p.speed], ["range", p.range], ["hands", p.handling], ["arm", p.arm]]
    : [["velocity", p.velo], ["accuracy", p.acc], ["finesse", p.fin], ["endurance", p.end]];
  const sorted = [...core].sort((a, b) => b[1] - a[1]);
  const strong = sorted.filter(x => x[1] >= 50).slice(0, 2).map(x => x[0]);
  const weak = sorted.reverse().filter(x => x[1] < 40).slice(0, 2).map(x => x[0]);
  let s = "";
  if (p.type === "Hitter") {
    const kind = p.pw >= 52 && p.ob >= 50 ? "a middle-of-the-order bat" : p.pw >= 52 ? "a power bat" : p.ob >= 52 ? "an on-base type" : p.glove >= 50 ? "a defense-first player" : "a role player";
    s = `${p.name.split(" ")[0]} profiles as ${kind}, best used at ${p.bestPos}.`;
  } else {
    const kind = p.canStart ? (p.stuff >= 50 ? "a front-half starter" : "a back-end starter or long man") : (p.velo >= 55 ? "a high-leverage reliever" : "a middle reliever");
    s = `${p.name.split(" ")[0]} profiles as ${kind}.`;
  }
  if (strong.length) s += ` Leans on his ${strong.join(" and ")}.`;
  if (weak.length) s += ` Watch the ${weak.join(" and ")}.`;
  return s;
}

// ---------------------------------------------------------------- rest status
function restInfo(p) {
  if (!p.availableAt) return null;
  const t = new Date(p.availableAt.replace(/(\.\d{3})\d+/, "$1"));
  if (isNaN(t)) return null;
  if (t <= new Date()) return { ready: true, text: "Rested" };
  return { ready: false, text: "Ready " + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
}
const restHTML = p => { const r = restInfo(p); return r ? `<span class="rest ${r.ready ? "" : "tired"}">${r.text}</span>` : ""; };

// ---------------------------------------------------------------- helpers
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const posText = p => p.type === "Pitcher" ? p.pos1 : p.pos1 + (p.pos2 ? `/${p.pos2}` : "");
const hand = p => p.type === "Hitter" ? `Bats ${p.bats || "?"}` : `Throws ${p.throws || "?"}`;
const fmt3 = v => v == null ? "–" : v.toFixed(3).replace(/^0/, "");
const fmt2 = v => v == null ? "–" : v.toFixed(2);
function barHTML(v, lo = 30, hi = 62) {
  const w = Math.max(4, Math.min(100, (v - lo) / (hi - lo) * 100));
  return `<span class="bar"><span class="track"><i style="width:${w}%"></i></span><span class="num small">${v.toFixed(1)}</span></span>`;
}
const playerLink = p => `data-pid="${p.id}" tabindex="0"`;

// ---------------------------------------------------------------- views
function viewRoster() {

    ${bestGlove ? `<button class="tile" ${playerLink(bestGlove)}><span class="k">Best glove</span><span class="v">${esc(bestGlove.name)} ${gr(bestGlove.glove)}</span><span class="d">at ${bestGlove.bestPos}</span></button>` : ""}
    ${fastest ? `<button class="tile" ${playerLink(fastest)}><span class="k">Best baserunner</span><span class="v">${esc(fastest.name)} ${gr(fastest.run)}</span><span class="d">Speed ${fastest.speed} · Awareness ${fastest.aware}</span></button>` : ""}
    ${state.club === "main" ? `<button class="tile" data-sort-cut="1"><span class="k">Send to ${esc(clubShort("farm"))}</span><span class="v" style="font-size:14px">${state.players.filter(p => p.move === "transfer").map(p => esc(p.name.split(" ").slice(-1)[0])).join(", ") || "Nobody"}</span><span class="d">${(() => { const r = state.players.filter(p => p.move === "release"); return r.length ? "Release if you need room: " + r.map(p => esc(p.name.split(" ").slice(-1)[0])).join(", ") : "Nobody needs releasing"; })()}</span></button>` : ""}

// ---------------------------------------------------------------- free agents
let faTimer = null, faFlash = "";
function blankFA(type) {
  const keep = state.fa[type];
  const f = { name: "", pos1: keep.pos1, pos2: "", hand: "R", age: "", tier: "Green" };
  (type === "Hitter" ? H_FIELDS : P_FIELDS).forEach(([k]) => f[k] = "");
  if (type === "Pitcher") { f.range = 40; f.handling = 40; f.arm = 40; }
  state.fa[type] = f;
}
const H_FIELDS = [["contact", "Contact"], ["power", "Power"], ["eye", "Plate discipline"], ["bunt", "Bunting"], ["speed", "Speed"], ["aware", "Awareness"], ["aggr", "Aggression"], ["range", "Fielding range"], ["handling", "Handling"], ["arm", "Arm strength"], ["flex", "Flexibility"]];
const P_FIELDS = [["velo", "Velocity"], ["acc", "Accuracy"], ["fin", "Finesse"], ["end", "Endurance"], ["range", "Fielding range"], ["handling", "Handling"], ["arm", "Arm strength"]];

function faPlayer() { return makePlayer(state.fa[state.faType], state.faType, -1); }
function makePlayer(f, type, id) {
  const isH = type === "Hitter";
  const n = k => Math.max(0, Math.min(100, Number(f[k]) || 0));
  const p = {
    id, isFA: true, name: (f.name || "").trim() || "Free agent", type,
    pos1: f.pos1, pos2: f.pos2 && f.pos2 !== f.pos1 ? f.pos2 : "", age: f.age, tier: f.tier, prime: "", ovr: 0,
    bats: isH ? f.hand : "", throws: isH ? "" : f.hand,
    range: n("range"), handling: n("handling"), arm: n("arm"), flex: isH ? n("flex") : 0,
    speed: isH ? n("speed") : 0, aggr: isH ? n("aggr") : 0, aware: isH ? n("aware") : 0,
    g: 0, availableAt: "", stats: {}, splits: { L: [], R: [] },
  };
  if (isH) Object.assign(p, { contact: n("contact"), power: n("power"), eye: n("eye"), bunt: n("bunt") });
  else Object.assign(p, { velo: n("velo"), acc: n("acc"), fin: n("fin"), end: n("end") });
  return p;
}

function analyzeFA() {
  const before = { lineups: state.lineups, staff: state.staff.map(s => ({ p: s.p, group: s.group, label: s.label })) };
  const saved = { players: state.players, hitters: state.hitters, pitchers: state.pitchers };
  const fa = faPlayer();
  const res = { fa, modes: {}, staff: null, bumped: null, drop: null };
  try {
    state.players = [...saved.players, fa];
    state.hitters = state.players.filter(p => p.type === "Hitter");
    state.pitchers = state.players.filter(p => p.type === "Pitcher");
    computeAll();
    ["RHP", "LHP", "POWER"].forEach(m => {
      const order = state.lineups[m].order, i = order.findIndex(s => s.h.id === -1);
      if (i < 0) return;
      const afterIds = new Set(order.map(s => s.h.id));
      const out = before.lineups[m].order.find(s => !afterIds.has(s.h.id));
      res.modes[m] = { spot: i + 1, pos: order[i].pos, out: out ? out.h : null, outPos: out ? out.pos : "" };
    });
    if (fa.type === "Pitcher") {
      const se = state.staff.find(s => s.p.id === -1);
      res.staff = { group: se.group, label: se.label };
      const prev = before.staff.find(s => s.group === se.group && !state.staff.some(x => x.p.id === s.p.id && x.group === s.group));
      if (se.group !== "Bullpen order" && prev) res.bumped = prev.p;
    }
    const others = state.players.filter(p => p.id !== -1 && !p.keep).sort((a, b) => a.cutRank - b.cutRank);
    let d = others.find(p => p.type === fa.type) || (fa.type === "Pitcher" ? null : others[0]);
    if (!d && fa.type === "Pitcher") d = state.pitchers.filter(p => p.id !== -1 && !p.locked).sort((a, b) => a.value - b.value)[0];
    if (d) res.drop = { p: d, why: d.why, move: d.move || "release" };
    res.faKeep = fa.keep; res.faWhy = fa.why; res.faCut = fa.cutRank;
    if (fa.type === "Hitter") {
      const pos = fa.pos1, list = state.hitters.filter(h => canPlay(h, pos)).sort((a, b) => (.75 * bat(b) + .25 * glove(b, pos)) - (.75 * bat(a) + .25 * glove(a, pos)));
      res.posRank = { pos, rank: list.findIndex(h => h.id === -1) + 1, of: list.length };
    }
    res.rosterRank = [...state.players].sort((a, b) => b.value - a.value).findIndex(p => p.id === -1) + 1;
    res.rosterSize = state.players.length;
  } finally {
    state.players = saved.players; state.hitters = saved.hitters; state.pitchers = saved.pitchers;
    computeAll();
  }
  // The starter he would compete with (hitters) for the comparison table.
  if (fa.type === "Hitter") {
    const s = before.lineups.RHP.order.find(x => x.pos === fa.pos1);
    res.incumbent = s ? s.h : null;
  } else res.incumbent = res.bumped;
  return res;
}

function verdictFor(r) {
  const fa = r.fa, n = esc(fa.name), drop = r.drop?.p;
  const pts = [];
  let kind = "pass", word = "Pass", line = "";
  const modeName = { RHP: "vs right-handers", LHP: "vs left-handers", POWER: "in the power lineup" };
  Object.entries(r.modes).forEach(([m, x]) => pts.push(`Starts ${modeName[m]} at ${x.pos}, batting ${x.spot}${["st","nd","rd"][x.spot-1] || "th"}${x.out ? `, replacing ${esc(x.out.name)}${x.outPos !== x.pos ? ` (${x.outPos})` : ""}` : ""}.`));
  if (fa.type === "Hitter") {
    if (r.modes.RHP && r.modes.LHP) { kind = "sign"; word = "Sign"; line = `${n} would start every day.`; }
    else if (r.modes.RHP || r.modes.LHP) { kind = "sign"; word = "Sign"; line = `${n} would be a platoon starter.`; }
    else if (r.faKeep) { kind = drop && fa.value > drop.value ? "sign" : "maybe"; word = kind === "sign" ? "Sign" : "Maybe"; line = `${n} wouldn't start, but fills a role: ${esc(r.faWhy.toLowerCase())}.`; }
    if (r.posRank) pts.push(`Ranks #${r.posRank.rank} of ${r.posRank.of} players who can play ${r.posRank.pos}.`);
  } else {
    const s = r.staff;
    if (s.group === "Rotation") { kind = "sign"; word = "Sign"; line = `${n} would join the rotation as ${s.label}${r.bumped ? `, moving ${esc(r.bumped.name)} to the bullpen` : ""}.`; }
    else if (s.group === "Closers") { kind = "sign"; word = "Sign"; line = `${n} would be ${s.label === "CL1" ? "your top closer" : "your second closer"}${r.bumped ? `, moving ${esc(r.bumped.name)} back to the bullpen` : ""}.`; }
    else if (Number(s.label) <= KEEP_PEN) { kind = "sign"; word = "Sign"; line = `${n} would slot in at #${s.label} in your bullpen order and pitch regularly.`; }
    else pts.push(`He'd sit at #${s.label} in the bullpen, behind the arms who actually pitch.`);
  }
  if (kind === "pass" && !line) {
    if (drop && fa.value > drop.value + 0.5) { kind = "maybe"; word = "Maybe"; line = `${n} is better than your weakest depth player, but he wouldn't get playing time.`; pts.push("Only worth it if you'd rather have his upside than an empty spot's worth of difference. He'd develop slowly without at-bats or innings."); }
    else { line = `${n} wouldn't play, and he'd be your #${r.faCut} release candidate himself.`; }
  }
  pts.push(`Overall he'd rank #${r.rosterRank} of ${r.rosterSize} on your roster by Value.`);
  return { kind, word, line, pts };
}

function compareRows(r) {
  const fa = r.fa, cols = [["Free agent", fa]];
  if (r.incumbent && r.incumbent.id !== r.drop?.p.id) cols.push([fa.type === "Hitter" ? `Your ${fa.pos1}` : "He'd bump", r.incumbent]);
  if (r.drop) cols.push([r.drop.move === "transfer" ? "Leaving (to farm)" : "Leaving (release)", r.drop.p]);
  const rows = fa.type === "Hitter"
    ? [["Value", p => barHTML(p.value)], ["Bat", p => gr(p.bat)], ["On-base", p => gr(p.ob)], ["Power", p => gr(p.pw)], ["Run", p => gr(p.run)],
       [`Glove at ${fa.pos1}`, p => canPlay(p, fa.pos1) ? gr(glove(p, fa.pos1)) : '<span class="muted small">Can\'t play it</span>'], ["Positions", p => posText(p)], ["Bats", p => p.bats || "–"], ["Age · Pack", p => `${p.age ?? "?"} · ${esc(p.tier || "?")}`]]
    : [["Value", p => barHTML(p.value)], ["Stuff", p => gr(p.stuff)], ["Starter grade", p => p.canStart ? gr(p.sp) : '<span class="muted small">Not enough endurance</span>'],
       ["Velocity", p => gr(p.velo)], ["Accuracy", p => gr(p.acc)], ["Finesse", p => gr(p.fin)], ["Endurance", p => gr(p.end)], ["Throws", p => p.throws || "–"], ["Age · Pack", p => `${p.age ?? "?"} · ${esc(p.tier || "?")}`]];
  return `<div class="table-wrap"><table class="compare"><thead><tr><th></th>${cols.map(([h, p]) => `<th>${h}<br><span style="text-transform:none;letter-spacing:0;font:600 14px var(--font-body);color:var(--ink)">${esc(p.name)}</span></th>`).join("")}</tr></thead>

}

function renderFAResult() {

  if (missing.length) {
    box.innerHTML = `${faFlash ? `<div class="notice info">${faFlash}</div>` : ""}<div class="card"><h3>Waiting for ratings</h3><p style="margin:0" class="muted">Fill in ${missing.length === 1 ? missing[0][1] : missing.length + " more ratings"} to see a verdict.</p></div>`;

  }
  const r = analyzeFA(), v = verdictFor(r);

  box.innerHTML = `${faFlash ? `<div class="notice info">${faFlash}</div>` : ""}

    <div class="card" style="gap:8px"><h3>What did you do?</h3>

      <div class="controls">

function handleAction(el) {
  const a = el.dataset.action, type = state.faType, f = state.fa[type];
  const name = (f.name || "").trim() || "Free agent";
  if (a === "sign" || a === "sign-drop") {
    recordSign(f, type);
    let msg = `Recorded: signed <b>${esc(name)}</b>`;
    if (a === "sign-drop") {
      const p = state.players.find(x => x.id === Number(el.dataset.drop));
      const kind = el.dataset.kind || "release";
      if (p) { if (kind === "transfer") sendToOther(p); recordRelease(p, kind); msg += kind === "transfer" ? `, sent <b>${esc(p.name)}</b> to the ${esc(clubName("farm"))}` : `, released <b>${esc(p.name)}</b>`; }
    } else msg += `. If you moved someone off the roster, open his card in Rankings and record it there.`;
    finishMove(msg + ". Ready for the next card.");
    blankFA(type); render(); return;
  }
  if (a === "skip") { faFlash = `Passed on <b>${esc(name)}</b>. Ready for the next card.`; blankFA(type); render(); return; }
  if (a === "release" || a === "transfer") {
    const p = state.players.find(x => x.id === Number(el.dataset.pid)); if (!p) return;
    if (a === "transfer") sendToOther(p);
    recordRelease(p, a); closeDrawer();
    finishMove(a === "transfer" ? `Recorded: moved <b>${esc(p.name)}</b> to the ${esc(clubName(otherClub()))}.` : `Recorded: released <b>${esc(p.name)}</b>.`); render(); return;
  }
  if (a === "undo") { undoLast(); finishMove("Undid the last move."); render(); return; }
  if (a === "clear-changes") { resetChanges(state.file); applyChanges(); faFlash = ""; render(); return; }
}
function finishMove(msg) { saveChanges(); applyChanges(); faFlash = msg; }

function rosterContext(includeFA) {
  const g = v => `${grade(v)}(${Math.round(v)})`;
  const status = p => p.callup ? `CALL UP: ${p.callup}` : p.move === "bench" ? `BENCH: ${p.why}` : p.keep ? `KEEP${p.locked ? " [locked in game]" : ""}: ${p.why}` : p.move === "transfer" ? `SEND TO FARM CLUB (#${p.cutRank} to leave): ${p.why}` : `RELEASE (#${p.cutRank} to leave): ${p.why}`;
  const H = [...state.hitters].sort((a, b) => b.value - a.value).map(h =>
    `${h.name} | ${posText(h)} | bats ${h.bats} | age ${h.age ?? "?"} | ${h.tier} | OVR ${h.ovr} | Value ${h.value.toFixed(1)} | Bat ${g(h.bat)} OnBase ${g(h.ob)} Power ${g(h.pw)} Run ${g(h.run)} Glove@${h.bestPos} ${g(h.glove)} | Con ${h.contact} Pow ${h.power} Eye ${h.eye} Bunt ${h.bunt} Spd ${h.speed} Awr ${h.aware} Agg ${h.aggr} Rng ${h.range} Hnd ${h.handling} Arm ${h.arm} Flx ${h.flex} | Role: ${h.role} | ${status(h)}${h.g ? ` | ${h.g} G, OPS ${fmt3(h.stats.OPS)}` : ""}`);
  const P = [...state.pitchers].sort((a, b) => b.value - a.value).map(p =>
    `${p.name} | ${p.pos1} | throws ${p.throws} | age ${p.age ?? "?"} | ${p.tier} | OVR ${p.ovr} | Value ${p.value.toFixed(1)} | Stuff ${g(p.stuff)} Starter ${p.canStart ? g(p.sp) : "n/a"} | Velo ${p.velo} Acc ${p.acc} Fin ${p.fin} End ${p.end} | Role: ${p.role} | ${status(p)}${p.g ? ` | ${p.g} G, ERA ${fmt2(p.stats.ERA)}` : ""}`);
  const L = m => state.lineups[m].order.map((s, i) => `${i + 1}. ${s.h.name} ${s.pos}`).join(", ");
  const staff = state.staff.map(s => `${s.label} ${s.p.name}`).join(", ");
  let fa = "";
  if (includeFA) {
    try {
      const r = analyzeFA(), v = verdictFor(r), p = r.fa;
      fa = `\n\nFREE AGENT BEING CONSIDERED (not on the roster yet):\n${p.name} | ${p.type} ${posText(p)} | ${p.type === "Hitter" ? `bats ${p.bats} | Con ${p.contact} Pow ${p.power} Eye ${p.eye} Bunt ${p.bunt} Spd ${p.speed} Awr ${p.aware} Agg ${p.aggr} Rng ${p.range} Hnd ${p.handling} Arm ${p.arm} Flx ${p.flex} | Bat ${g(p.bat)} Glove@${p.bestPos} ${g(p.glove)}` : `throws ${p.throws} | Velo ${p.velo} Acc ${p.acc} Fin ${p.fin} End ${p.end} | Stuff ${g(p.stuff)}`} | Value ${p.value.toFixed(1)}\nPage verdict: ${v.word}. ${v.line.replace(/<[^>]+>/g, "")} ${v.pts.join(" ").replace(/<[^>]+>/g, "")}\nSuggested release: ${r.drop ? `${r.drop.p.name} (${r.drop.why})` : "none"}`;
    } catch (_) {}
  }
  return `You are the bench coach for the user's club, the ${clubName(state.club)}${state.club === "farm" ? ` (their farm club; their main club is the ${clubName("main")}, and players marked CALL UP would earn a role there)` : ""}, in curveball.gg, a browser baseball sim. Answer questions about their roster using ONLY the data below. Keep answers short (under 150 words unless asked for more), in plain language, and point to the specific ratings that matter. Use **bold** for player names on first mention and "- " for bullets. If the data can't answer something, say so. Don't invent game mechanics.

HOW THE GAME WORKS (from its Help pages): Contact = fewer whiffs, more line drives. Power = extra bases and HR. Plate discipline = walks, squaring the ball up. Speed and Awareness = baserunning (aware runners are safe more often). Aggression = runs harder and steals more, and hitters pull the ball. Range = ground covered. Handling = clean plays, fewer errors (catchers: fewer passed balls, slow stealers). Arm = throwing runners out. Flexibility = infield double plays only. Velocity and Finesse miss bats; Accuracy prevents walks; Endurance = how deep a pitcher goes. Relievers are used from the top of the bullpen order; mop-up arms come from the bottom; pitchers need rest days. Roster limits: max ${ROSTER_MAX} players and ${PITCHER_MAX} pitchers, min 25 and 5. Locked players and players in the starting lineup can't be dropped. Young players develop by playing, so bench players who never play develop slowly. The user also owns a second club, the ${state.farm.name}, used as a farm club: players can be transferred between the two clubs, so a player who wouldn't play here can be sent there for at-bats and innings instead of being released (${farmOpen().players} roster spots and ${farmOpen().pitchers} pitcher spots open there).

HOW THIS PAGE SCORES PLAYERS (estimates, since the game doesn't publish formulas): Letter grades on a fixed scale (A+ 65+, A 60, A- 57, B+ 54, B 51, B- 48, C+ 45, C 42, C- 39, D+ 36, D 32, F below). OnBase = 50% Contact + 50% Eye. Power = 70% Power + 30% Contact. Run = 60% Speed + 40% Awareness. Bat = 45% OnBase + 40% Power + 15% Run. Glove depends on position. Hitter Value = 75% Bat + 25% Glove at best position. Pitcher Stuff = 38% Velo + 32% Acc + 30% Fin; Starter = 80% Stuff + 20% Endurance (needs End 55+). KEEP = starts, is a recommended sub, is the only good backup at a position, is in the rotation, closes, or is in the top 6 of the bullpen, or is locked. Everyone else is marked SEND TO FARM CLUB (most upside first, while the farm has room; upside = Value + youth + pack tier + a standout rating) or RELEASE.

ROSTER: ${state.players.length}/${ROSTER_MAX} players, ${state.pitchers.length}/${PITCHER_MAX} pitchers.
HITTERS (best Value first):
${H.join("\n")}

PITCHERS (best Value first):
${P.join("\n")}

LINEUP vs RHP: ${L("RHP")}
LINEUP vs LHP: ${L("LHP")}
POWER LINEUP: ${L("POWER")}
PITCHING STAFF ORDER: ${staff}${fa}`;
}

function mdLite(s) {
  const lines = esc(s).split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^\s*[-•*]\s+/.test(line)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${line.replace(/^\s*[-•*]\s+/, "")}</li>`; }
    else { if (inList) { html += "</ul>"; inList = false; } if (line.trim()) html += `<p>${line}</p>`; }
  }
  return html + (inList ? "</ul>" : "");
}
const COACH_STARTERS = ["Who should I release first, and why?", "Who is my weakest everyday starter?", "Explain my bullpen order.", "Which bench players have the most upside?"];
